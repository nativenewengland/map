name: Temporary WC3 loading screen extraction

on:
  push:
    branches:
      - tmp/wc3-loading-screen-extraction
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install video tools
        run: |
          python -m pip install --upgrade "yt-dlp[default]"
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Try public privacy-front-end APIs
        run: |
          mkdir -p diagnostics
          set +e
          for api in \
            https://pipedapi.kavin.rocks \
            https://pipedapi.tokhmi.xyz \
            https://pipedapi.moomoo.me \
            https://pipedapi.syncpundit.io \
            https://api-piped.mha.fi \
            https://piped-api.garudalinux.org; do
            name=$(echo "$api" | sed 's#https://##;s#[^A-Za-z0-9]#_#g')
            curl -fL --compressed --connect-timeout 15 --max-time 90 \
              -A 'Mozilla/5.0' "$api/streams/eq2v0T4Hcf0" \
              -o "diagnostics/piped_${name}.json"
          done
          for api in \
            https://invidious.nerdvpn.de \
            https://yt.chocolatemoo53.com; do
            name=$(echo "$api" | sed 's#https://##;s#[^A-Za-z0-9]#_#g')
            curl -fL --compressed --connect-timeout 15 --max-time 90 \
              -A 'Mozilla/5.0' "$api/api/v1/videos/eq2v0T4Hcf0?local=true" \
              -o "diagnostics/invidious_${name}.json"
          done
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          candidates = []
          reports = []
          for path in Path('diagnostics').glob('piped_*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  reports.append(f'{path.name}: invalid JSON: {exc!r}')
                  continue
              streams = data.get('videoStreams') or []
              reports.append(f'{path.name}: {len(streams)} video streams; error={data.get("error")!r}')
              for stream in streams:
                  url = stream.get('url')
                  if not url:
                      continue
                  quality = str(stream.get('quality') or '')
                  match = re.search(r'(\d+)', quality)
                  height = int(match.group(1)) if match else int(stream.get('height') or 0)
                  codec = str(stream.get('codec') or stream.get('format') or '')
                  candidates.append((min(height, 1080), height <= 1080, 'piped', codec, url, path.name))

          for path in Path('diagnostics').glob('invidious_*.json'):
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  reports.append(f'{path.name}: invalid JSON: {exc!r}')
                  continue
              streams = (data.get('adaptiveFormats') or []) + (data.get('formatStreams') or [])
              reports.append(f'{path.name}: {len(streams)} video streams; error={data.get("error")!r}')
              for stream in streams:
                  if not str(stream.get('type') or '').startswith('video/'):
                      continue
                  url = stream.get('url')
                  if not url:
                      continue
                  height = int(stream.get('height') or 0)
                  candidates.append((min(height, 1080), height <= 1080, 'invidious', str(stream.get('type')), url, path.name))

          Path('diagnostics/frontend_api_report.txt').write_text('\n'.join(reports), encoding='utf-8')
          candidates.sort(key=lambda x: (x[1], x[0]), reverse=True)
          with open('diagnostics/frontend_stream_candidates.txt', 'w', encoding='utf-8') as f:
              for item in candidates:
                  f.write(repr(item[:-1]) + f' from {item[-1]}\n')

          for score, within, kind, codec, url, source in candidates:
              print(f'Trying {kind} stream height={score}, codec={codec}, source={source}')
              proc = subprocess.run([
                  'curl', '-fL', '--retry', '2', '--connect-timeout', '20', '--max-time', '180',
                  '-A', 'Mozilla/5.0', url, '-o', 'source.mp4'
              ], text=True, capture_output=True)
              with open('diagnostics/frontend_download.log', 'a', encoding='utf-8') as f:
                  f.write(f'\nSOURCE {source}\nURL {url}\nRETURN {proc.returncode}\n{proc.stdout}\n{proc.stderr}\n')
              target = Path('source.mp4')
              if proc.returncode == 0 and target.exists() and target.stat().st_size > 100000:
                  print(f'Downloaded {target.stat().st_size} bytes')
                  break
              target.unlink(missing_ok=True)
          PY

      - name: Fetch watch pages and storyboard sheets
        run: |
          mkdir -p diagnostics storyboards
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          curl -L --compressed -A "$UA" \
            'https://www.youtube.com/watch?v=eq2v0T4Hcf0' \
            -o diagnostics/youtube_watch.html || true
          curl -L --compressed -A "$UA" \
            'https://www.youtube.com/embed/eq2v0T4Hcf0' \
            -o diagnostics/youtube_embed.html || true
          python - <<'PY'
          import html as html_lib
          import json
          import math
          import re
          import urllib.request
          from pathlib import Path

          out = Path('storyboards')
          out.mkdir(exist_ok=True)
          specs = []
          for page in Path('diagnostics').glob('youtube_*.html'):
              text = page.read_text(encoding='utf-8', errors='ignore')
              patterns = [
                  r'"playerStoryboardSpecRenderer"\s*:\s*\{\s*"spec"\s*:\s*"((?:\\.|[^"\\])*)"',
                  r'"spec"\s*:\s*"((?:https?:)?\\?/\\?/i\.ytimg\.com\\?/sb\\?/eq2v0T4Hcf0(?:\\.|[^"\\])*)"',
              ]
              for pattern in patterns:
                  for raw in re.findall(pattern, text):
                      try:
                          decoded = json.loads('"' + raw + '"')
                      except Exception:
                          decoded = raw.replace('\\u0026', '&').replace('\\/', '/')
                      decoded = html_lib.unescape(decoded)
                      if decoded not in specs:
                          specs.append(decoded)

          Path('diagnostics/storyboard_specs.txt').write_text('\n\n'.join(specs), encoding='utf-8')
          ua = {'User-Agent': 'Mozilla/5.0'}
          downloaded = 0
          for spec_index, spec in enumerate(specs):
              parts = spec.split('|')
              if len(parts) < 2:
                  continue
              template = parts[0]
              for level_index, level in enumerate(parts[1:]):
                  fields = level.split('#')
                  if len(fields) < 8:
                      continue
                  try:
                      width, height, count, cols, rows = map(int, fields[:5])
                  except ValueError:
                      continue
                  sigh = fields[-1]
                  sheets = max(1, math.ceil(count / max(1, cols * rows)))
                  for sheet in range(sheets):
                      url = template
                      for old, new in {'$L': str(level_index), '$N': f'M{sheet}', '$M': f'M{sheet}', '$sigh': sigh}.items():
                          url = url.replace(old, new)
                      if url.startswith('//'):
                          url = 'https:' + url
                      target = out / f'spec{spec_index}_level{level_index}_{width}x{height}_sheet{sheet:03d}.jpg'
                      try:
                          req = urllib.request.Request(url, headers=ua)
                          with urllib.request.urlopen(req, timeout=30) as response:
                              target.write_bytes(response.read())
                          downloaded += 1
                      except Exception as exc:
                          with open('diagnostics/storyboard_errors.txt', 'a', encoding='utf-8') as f:
                              f.write(f'{url}\n{exc!r}\n\n')
          print(f'Downloaded {downloaded} storyboard sheets')
          PY

      - name: Try embedded YouTube clients
        if: ${{ hashFiles('source.mp4') == '' }}
        run: |
          set +e
          : > diagnostics/yt-dlp.log
          for client in web_embedded web_safari mweb android_vr; do
            echo "===== CLIENT: $client =====" | tee -a diagnostics/yt-dlp.log
            yt-dlp --no-playlist --js-runtimes node \
              --extractor-args "youtube:player_client=$client" \
              -f "bv*[height<=1080]+ba/b[height<=1080]/b" \
              --merge-output-format mp4 \
              -o source.mp4 \
              'https://www.youtube.com/watch?v=eq2v0T4Hcf0' \
              2>&1 | tee -a diagnostics/yt-dlp.log
            if [ -s source.mp4 ]; then
              exit 0
            fi
          done
          exit 0

      - name: Extract full-resolution video frames when available
        run: |
          mkdir -p frames scene_frames
          if [ -s source.mp4 ]; then
            ffmpeg -hide_banner -loglevel error -i source.mp4 \
              -vf "fps=2" -q:v 2 frames/frame_%04d.jpg
            ffmpeg -hide_banner -loglevel error -i source.mp4 \
              -vf "select='gt(scene,0.06)'" -fps_mode vfr -q:v 2 scene_frames/scene_%04d.jpg
            ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate \
              -of default=noprint_wrappers=1 source.mp4 > diagnostics/video_metadata.txt
            python - <<'PY'
          from pathlib import Path
          files = sorted(Path('frames').glob('frame_*.jpg'))
          with open('diagnostics/frame_timestamps.csv', 'w', encoding='utf-8') as f:
              f.write('filename,timestamp_seconds\n')
              for i, path in enumerate(files):
                  f.write(f'{path.name},{i / 2:.1f}\n')
          PY
          fi

      - name: Upload extracted material
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wc3-loading-screen-frames
          path: |
            frames/
            scene_frames/
            storyboards/
            diagnostics/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 1
