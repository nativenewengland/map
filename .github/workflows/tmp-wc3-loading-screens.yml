name: Temporary WC3 loading screen extraction

on:
  push:
    branches:
      - tmp/wc3-loading-screen-extraction
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install video tools
        run: |
          python -m pip install --upgrade yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download source video
        run: |
          yt-dlp --no-playlist \
            -f "bv*[height<=1080]+ba/b[height<=1080]/b" \
            --merge-output-format mp4 \
            -o source.mp4 \
            "https://www.youtube.com/watch?v=eq2v0T4Hcf0"

      - name: Extract full-resolution frames
        run: |
          mkdir -p frames scene_frames
          ffmpeg -hide_banner -loglevel error -i source.mp4 \
            -vf "fps=2" -q:v 2 frames/frame_%04d.jpg
          ffmpeg -hide_banner -loglevel error -i source.mp4 \
            -vf "select='gt(scene,0.06)'" -fps_mode vfr -q:v 2 scene_frames/scene_%04d.jpg
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 source.mp4 > video_metadata.txt
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('frames').glob('frame_*.jpg'))
          with open('frame_timestamps.csv', 'w', encoding='utf-8') as f:
              f.write('filename,timestamp_seconds\n')
              for i, path in enumerate(files):
                  f.write(f'{path.name},{i / 2:.1f}\n')
          PY

      - name: Upload extracted frames
        uses: actions/upload-artifact@v4
        with:
          name: wc3-loading-screen-frames
          path: |
            frames/
            scene_frames/
            video_metadata.txt
            frame_timestamps.csv
          compression-level: 0
          retention-days: 1
